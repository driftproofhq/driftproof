# SPDX-License-Identifier: Apache-2.0
# Copy into .github/workflows/ beside your CLAUDE.md and driftproof/tasks.json.
# This offline example makes no model calls. Stub receipts are UNVERIFIED and
# NOT_MEASURED; they are not measurements of the rules or their differences.
# Replace vX with a release containing compare-with-base, or its full commit SHA.
# For a measured run, follow the README's GitHub Action provider setup and budgets.
name: driftproof-compare-rules-file

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      DRIFTPROOF_STUB: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: driftproofhq/driftproof@vX
        with:
          skill-dir: CLAUDE.md
          suite: driftproof/tasks.json
          compare-with-base: 'true'
