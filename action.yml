# SPDX-License-Identifier: Apache-2.0
name: 'Driftproof'
description: 'Verify an agent skill still helps: run its eval suite with and without the skill, and fail the job if it regressed.'
author: 'driftproofhq'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  skill-dir:
    description: 'Path to the skill directory (contains SKILL.md and evals/evals.json), relative to the repo root.'
    required: true
  models:
    description: 'Comma-separated model ids/aliases to run the suite on.'
    required: false
    default: 'claude-haiku-4-5'
  max-usd:
    description: 'Hard USD budget for the run. The projection is refused before any model call if it would exceed this.'
    required: false
    default: '20'
  max-calls:
    description: 'Hard per-model call cap. The projection is refused before any model call if it would exceed this. A v0.5 run draws the generation up to SAMPLING.max times per arm, so a case costs up to 120 calls.'
    required: false
    default: '2000'
  api-key:
    description: 'Anthropic API key (pass from a repository secret). When set, the run uses the Messages API (CLAUDE_PROVIDER=api).'
    required: false
    default: ''
  fail-on-regression:
    description: 'Fail the job when the verdict is REGRESSED (the skill measurably hurt on this model).'
    required: false
    default: 'true'
  fail-on-underpowered:
    description: 'Fail the job when a model''s decision is UNDERPOWERED (Not enough draws to conclude at this effect floor, or, where the cases disagree, More cases, not more draws, are needed to conclude at this effect floor), or INCONCLUSIVE because of lost draws. Default false: the enforcement step warns and does not fail on them.'
    required: false
    default: 'false'
  pr-comment:
    description: 'On a pull request, post one comment with the result in plain words, edited in place on each run. Needs the pull-requests: write permission; without it (a fork, or a read-only token) the Action writes one notice and the run is unchanged. Set to false to turn it off.'
    required: false
    default: 'true'
  github-token:
    description: 'The token the pull request comment is posted with. Default: the job''s own token. The comment is found again only when a bot wrote it (the job''s token or an app''s); a person''s token posts a new comment on each run.'
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: 'The WORST decision across every receipt the run produced: PASSED | NO_EFFECT | UNDERPOWERED | INCONCLUSIVE | NOT_MEASURED | REFUSED | REGRESSED (spec 030; UNDERPOWERED, spec 035).'
    value: ${{ steps.run.outputs.verdict }}
  delta:
    description: 'Measured skill lift (with_skill mean minus baseline mean) for the model the worst decision came from.'
    value: ${{ steps.run.outputs.delta }}
  worst_state:
    description: 'The worst decision state across the run: regression | refused | inconclusive | not measured | underpowered | no detected effect | helped.'
    value: ${{ steps.run.outputs.worst_state }}
  regressed_models:
    description: 'Comma-separated model ids that measurably regressed. Empty when none did.'
    value: ${{ steps.run.outputs.regressed_models }}
  missing_models:
    description: 'Comma-separated requested model ids for which the run produced no receipt.'
    value: ${{ steps.run.outputs.missing_models }}
  draws_needed:
    description: 'When the worst decision is UNDERPOWERED: the draws per arm that would have been needed to resolve the effect floor with the spreads held, or none when no draw count reaches it at those spreads. Empty otherwise (spec 035).'
    value: ${{ steps.run.outputs.draws_needed }}
  receipts_dir:
    description: 'Directory holding every receipt this invocation produced, made fresh for it under the runner temp directory (spec 050).'
    value: ${{ steps.run.outputs.receipts_dir }}
  artifact_name:
    description: 'Name of the artifact this invocation uploaded its receipts under. Unique per invocation, so a job may run the action more than once (spec 050).'
    value: ${{ steps.run.outputs.artifact_name }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      # Pinned to the commit the v4 tag resolved to on 2026-09-03 (spec 023, audit A9).
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: Install driftproof dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      # Fails closed: a lockfile that disagrees with the manifest stops the job
      # rather than being resolved from the registry (spec 023, audit A9).
      run: npm ci --omit=dev --no-audit --no-fund

    # SPEC 023 (audit A1). Every input crosses into the shell as an ENVIRONMENT
    # VARIABLE set here, and the run: line carries no ${{ }} expression at all.
    # An expression substituted into run: is replaced with its text BEFORE bash
    # parses the script, so a value carrying a quote, a semicolon, $(...), a
    # backtick or a newline becomes shell code on the runner. A variable set by
    # env: is data. The step body lives in action/run.sh so the spec gate can
    # execute the exact bytes GitHub executes, with hostile values in the same
    # variables. GITHUB_ACTION_PATH is the default variable GitHub sets for a
    # composite action step.
    - name: Run suite and emit receipt
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        INPUT_SKILL_DIR: ${{ inputs.skill-dir }}
        INPUT_MODELS: ${{ inputs.models }}
        INPUT_MAX_USD: ${{ inputs.max-usd }}
        INPUT_MAX_CALLS: ${{ inputs.max-calls }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_FAIL_ON_UNDERPOWERED: ${{ inputs.fail-on-underpowered }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh"

    # SPEC 050 (AC-5). This invocation's directory, under this invocation's name. The
    # fixed name `driftproof-receipt` made a second invocation in one job fail here,
    # since upload-artifact v4 refuses a name already on the run, and the fixed path
    # uploaded every invocation's receipts together.
    - name: Upload receipt artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.run.outputs.artifact_name }}
        path: ${{ steps.run.outputs.receipts_dir }}
        if-no-files-found: error

    # SPEC 128 (AC-12). One pull request comment, edited in place on each run and
    # found by a hidden marker; on by default, off with pr-comment: false. It runs
    # BEFORE the enforcement step, so a failing verdict still gets its comment, and
    # it can never fail or block the job: continue-on-error here, and
    # action/comment.sh exits 0 on every path, writing one ::notice when the token
    # cannot write comments (a fork, or no pull-requests: write). The token is the
    # github-token input, the job's own by default: an input's default may read the
    # github context, and a step's env: then reads inputs only, as every other step
    # here does. On any event but a pull request it makes no request. Every value
    # crosses as an env: entry, as spec 023 requires; the step has no if: on an input.
    - name: Comment on the pull request
      shell: bash
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRIFTPROOF_RECEIPTS: ${{ steps.run.outputs.receipts_dir }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
        INPUT_SKILL_DIR: ${{ inputs.skill-dir }}
        INPUT_MODELS: ${{ inputs.models }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_FAIL_ON_UNDERPOWERED: ${{ inputs.fail-on-underpowered }}
      run: bash "$GITHUB_ACTION_PATH/action/comment.sh"

    # The step outputs take the same path (audit A6, second site): a receipt's
    # model_id reached this shell through steps.run.outputs.verdict.
    - name: Enforce verdict
      shell: bash
      env:
        DRIFTPROOF_VERDICT: ${{ steps.run.outputs.verdict }}
        DRIFTPROOF_DELTA: ${{ steps.run.outputs.delta }}
        # SPEC 030 AC-1: the receipt DIRECTORY, so the decision is taken over
        # every receipt the run produced rather than over one file a glob chose.
        DRIFTPROOF_RECEIPTS: ${{ steps.run.outputs.receipts_dir }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_FAIL_ON_UNDERPOWERED: ${{ inputs.fail-on-underpowered }}
        INPUT_MODELS: ${{ inputs.models }}
      run: bash "$GITHUB_ACTION_PATH/action/enforce.sh"
