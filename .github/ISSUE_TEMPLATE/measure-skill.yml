name: Measure a skill
description: Send one public skill or rules file. We measure it and publish what we find. It's free.
title: "Measure a skill: "
labels: [offer, offer-skill]
body:
  - type: markdown
    attributes:
      value: |
        Rules files are welcome too. Use the same fields below for a rules file. We measure its instructions as always-on text, with the same three tasks, two models and labels. The editor's system prompt and rule selection are not reproduced. Skills and rules files share the first 50 requests and the USD 50 limit per request. A pack may mix both, up to 20 items in total.

        We write three tasks for the skill and run them on Claude Haiku 5.5 and Claude Sonnet 5.5 with the skill, with no skill and with a same-length placebo. The skill gets Keep, Delete candidate or Cannot tell on each model, and we publish the result, whatever it says. The terms and the queue are on https://driftproofhq.com/measure/.

        If the skill is private, do not open a public request. Email hello@driftproofhq.com instead.
  - type: input
    id: repository
    attributes:
      label: Repository link
      description: The public GitHub repository that holds the skill.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill path
      description: The skill's SKILL.md path or folder, or the exact rules-file path. See the supported files at https://driftproofhq.com/measure/.
      placeholder: skills/my-skill/SKILL.md
    validations:
      required: true
  - type: dropdown
    id: author
    attributes:
      label: Are you the author?
      description: Anyone can ask. If you are not the author, the result page says so.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
