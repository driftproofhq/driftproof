name: Measure a pack
description: Send up to 20 public skills or rules files. We measure every skill and publish what we find. It's free.
title: "Measure a pack: "
labels: [offer, offer-pack]
body:
  - type: markdown
    attributes:
      value: |
        Rules files are welcome too. Use the same fields below for a rules file. We measure its instructions as always-on text, with the same three tasks, two models and labels. The editor's system prompt and rule selection are not reproduced. Skills and rules files share the first 50 requests and the USD 50 limit per request. A pack may mix both, up to 20 items in total.

        For each skill we write three tasks and run them on Claude Haiku 5.5 and Claude Sonnet 5.5 with the skill, with no skill and with a same-length placebo. Each skill gets Keep, Delete candidate or Cannot tell on each model, and we publish the result, whatever it says. The terms and the queue are on https://driftproofhq.com/measure/.

        If the skill is private, do not open a public request. Email hello@driftproofhq.com instead.
  - type: input
    id: repository
    attributes:
      label: Repository link
      description: The public GitHub repository that holds the skills.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: skills
    attributes:
      label: Skill paths
      description: One skill folder, SKILL.md path or rules-file path per line, up to 20 items in total. See the supported files at https://driftproofhq.com/measure/.
      placeholder: skills/my-skill/SKILL.md
    validations:
      required: true
  - type: dropdown
    id: author
    attributes:
      label: Are you the author?
      description: Anyone can ask. If you are not the author, the result page says so.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
