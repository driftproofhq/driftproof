name: plugin self-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    # This file ships in the public tree. On driftproof-source it runs on the box's self-hosted runners
    # (issue 48: hosted minutes); everywhere else, the public repository and its forks among them, on
    # GitHub-hosted ubuntu-latest, so no public repository ever reaches a self-hosted runner.
    runs-on: ${{ github.repository == 'driftproofhq/driftproof-source' && fromJSON('["self-hosted", "light"]') || 'ubuntu-latest' }}
    env:
      DRIFTPROOF_STUB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # On driftproof-source the gate tells the source tree from a published one by its history reaching
          # the source's root commit, so the checkout there is full; a shallow one read as published (issue 56).
          fetch-depth: ${{ github.repository != 'driftproofhq/driftproof-source' && 1 || 0 }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: install (the runner's own deps; the plugin has none)
        run: npm ci --omit=dev
      - name: Plugin compatibility (offline, stubbed)
        run: node --test tests/plugin-compat.test.js
      - name: the manifests validate as manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/driftproof/.claude-plugin/plugin.json','utf8'))"
