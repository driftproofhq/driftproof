# The Claude Code plugin self-test (spec 028, AC-13; step amended at A-028-34).
#
# This workflow ships in the published tree, so it runs only what that tree
# carries: the tree's own documented gate. The fake-CLI self-test lives in the
# source repository, outside the published tree, and it runs in
# that repository's gate. Here the gate proves the plugin's manifest, its three
# command step blocks and its input contract against action/lib.sh, plus the
# published gate's scans, tarball whitelist and exclusions. It does not exercise
# the door's or the badge's behaviour, which needs the harness and the fake CLIs.
#
# SPENDS NOTHING: no secret is read and no provider is reached. The gate runs
# offline under DRIFTPROOF_STUB=1. Its four publish-state exclusion checks assert
# in every tree but the source repository, so here they assert with or without --scan-root .
name: plugin self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    env:
      DRIFTPROOF_STUB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: install (the runner's own deps; the plugin has none)
        run: npm ci --omit=dev
      - name: the published tree's own gate (offline, stubbed)
        run: node tests/gate.js --scan-root .
      - name: the manifests validate as manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin/driftproof/.claude-plugin/plugin.json','utf8'))"
