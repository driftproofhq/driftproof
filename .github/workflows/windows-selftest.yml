# The package's own gate on Windows (spec 312).
#
# The package gate runs only in the public repository, on a hosted windows-latest runner. It runs only on the public repository:
# every job is guarded to it, so on driftproof-source, where Windows minutes bill double, nothing
# runs. Its scope is the package's gate and nothing more: a green run says no more than that the
# gate passed there, and no page says Windows is supported.
#
# A push run on main tests that commit under this file as main holds it. A pull-request run tests
# GitHub's merge commit under the pull request's own copy of this file; spec 312 claims nothing
# for it.
#
# SPENDS NOTHING: no secret is read and no provider is reached. The gate runs offline under
# DRIFTPROOF_STUB=1. On win32 two rows read not applicable, by name and with a cause: the bash
# probes of scripts/build-public.sh, the publish tool that runs on the Linux box alone.
name: 'windows: package gate only'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-gate:
    name: 'windows: package gate only'
    if: github.repository == 'driftproofhq/driftproof'
    runs-on: windows-latest
    env:
      DRIFTPROOF_STUB: '1'
    steps:
      # Before checkout, so git converts no file that carries no text attribute: the root files and
      # plugin/ check out as stored. The folders' own .gitattributes say the same (spec 312 AC-4).
      - name: check out the bytes the repository stores
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/windows-setup
      - name: the package's own gate (offline, stubbed)
        # Git Bash, so the gate's bash and tar are the ones a composite action's bash step gets.
        shell: bash
        run: node tests/gate.js --scan-root .
